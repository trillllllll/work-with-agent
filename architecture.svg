<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工作室分层架构</title>
  <desc id="desc">表现层、应用层、领域层、基础设施层和外部系统的依赖关系图</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .layer { stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .layer-title { font: 700 22px sans-serif; fill: #0f172a; }
      .layer-note { font: 14px sans-serif; fill: #475569; }
      .module { stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .module-title { font: 600 16px sans-serif; fill: #0f172a; }
      .module-text { font: 13px sans-serif; fill: #334155; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .port { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="60" y="48" class="layer-title" font-size="28">Agent 工作室：五层架构</text>
  <text x="60" y="76" class="layer-note">每一层只表达一种职责；外部系统不属于应用内部</text>

  <!-- 外部系统 -->
  <rect x="60" y="110" width="1080" height="110" fill="#fef3c7" class="layer"/>
  <text x="88" y="145" class="layer-title">外部系统</text>
  <text x="88" y="170" class="layer-note">应用无法控制、通过适配器连接的系统</text>
  <rect x="500" y="132" width="250" height="62" fill="#fff7ed" class="module"/>
  <text x="625" y="158" text-anchor="middle" class="module-title">OpenAI 兼容模型服务</text>
  <text x="625" y="180" text-anchor="middle" class="module-text">推理、流式输出</text>

  <!-- 表现层 -->
  <rect x="60" y="250" width="1080" height="120" fill="#dbeafe" class="layer"/>
  <text x="88" y="285" class="layer-title">表现层</text>
  <text x="88" y="310" class="layer-note">接收用户输入，展示工作状态</text>
  <rect x="300" y="270" width="170" height="70" fill="#eff6ff" class="module"/>
  <text x="385" y="298" text-anchor="middle" class="module-title">聊天界面</text>
  <text x="385" y="320" text-anchor="middle" class="module-text">React · TypeScript</text>
  <rect x="490" y="270" width="170" height="70" fill="#eff6ff" class="module"/>
  <text x="575" y="298" text-anchor="middle" class="module-title">任务看板</text>
  <text x="575" y="320" text-anchor="middle" class="module-text">项目、任务、进度</text>
  <rect x="680" y="270" width="170" height="70" fill="#eff6ff" class="module"/>
  <text x="765" y="298" text-anchor="middle" class="module-title">计划视图</text>
  <text x="765" y="320" text-anchor="middle" class="module-text">目标、阶段、时间线</text>

  <!-- 应用层 -->
  <rect x="60" y="400" width="1080" height="120" fill="#dcfce7" class="layer"/>
  <text x="88" y="435" class="layer-title">应用层</text>
  <text x="88" y="460" class="layer-note">编排一次完整的用户用例</text>
  <rect x="250" y="420" width="180" height="70" fill="#f0fdf4" class="module"/>
  <text x="340" y="448" text-anchor="middle" class="module-title">对话协作</text>
  <text x="340" y="470" text-anchor="middle" class="module-text">消息、Agent 协作</text>
  <rect x="460" y="420" width="180" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" class="module"/>
  <text x="550" y="448" text-anchor="middle" class="module-title">任务推进</text>
  <text x="550" y="470" text-anchor="middle" class="module-text">项目、任务、进度</text>
  <rect x="670" y="420" width="180" height="70" fill="#f0fdf4" class="module"/>
  <text x="760" y="448" text-anchor="middle" class="module-title">计划管理</text>
  <text x="760" y="470" text-anchor="middle" class="module-text">目标、阶段、规划</text>

  <!-- 领域层 -->
  <rect x="60" y="550" width="1080" height="120" fill="#f3e8ff" class="layer"/>
  <text x="88" y="585" class="layer-title">领域层</text>
  <text x="88" y="610" class="layer-note">表达“工作如何被组织和推进”的业务概念</text>
  <rect x="300" y="570" width="190" height="70" fill="#faf5ff" class="module"/>
  <text x="395" y="598" text-anchor="middle" class="module-title">协作记录</text>
  <text x="395" y="620" text-anchor="middle" class="module-text">对话、活动、产出物</text>
  <rect x="520" y="570" width="190" height="70" fill="#faf5ff" class="module"/>
  <text x="615" y="598" text-anchor="middle" class="module-title">工作项</text>
  <text x="615" y="620" text-anchor="middle" class="module-text">任务、里程碑</text>
  <rect x="740" y="570" width="190" height="70" fill="#faf5ff" class="module"/>
  <text x="835" y="598" text-anchor="middle" class="module-title">工作空间</text>
  <text x="835" y="620" text-anchor="middle" class="module-text">项目、长期计划</text>

  <!-- 基础设施层 -->
  <rect x="60" y="700" width="1080" height="90" fill="#f1f5f9" class="layer"/>
  <text x="88" y="735" class="layer-title">基础设施层</text>
  <text x="88" y="760" class="layer-note">提供技术实现，不定义业务含义</text>
  <rect x="390" y="718" width="170" height="48" fill="#ffffff" class="module"/>
  <text x="475" y="748" text-anchor="middle" class="module-title">SQLite 存储</text>
  <rect x="590" y="718" width="170" height="48" fill="#ffffff" class="module"/>
  <text x="675" y="748" text-anchor="middle" class="module-title">模型适配器</text>
  <rect x="790" y="718" width="130" height="48" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4" class="module"/>
  <text x="855" y="748" text-anchor="middle" class="module-title">执行环境（可选）</text>
  <rect x="940" y="718" width="130" height="48" fill="#ffffff" class="module"/>
  <text x="1005" y="748" text-anchor="middle" class="module-title">日志</text>

  <!-- 依赖箭头 -->
  <path d="M 385 340 L 340 420" class="flow"/>
  <path d="M 575 340 L 550 420" class="flow"/>
  <path d="M 765 340 L 760 420" class="flow"/>
  <path d="M 340 490 L 395 570" class="flow"/>
  <path d="M 550 490 L 615 570" class="flow"/>
  <path d="M 760 490 L 835 570" class="flow"/>
  <path d="M 395 640 L 475 718" class="port"/>
  <path d="M 615 640 L 475 718" class="port"/>
  <path d="M 835 640 L 475 718" class="port"/>
  <path d="M 340 490 C 300 560, 675 650, 675 718" class="port"/>
  <path d="M 550 490 C 550 580, 1005 650, 1005 718" class="port"/>
  <path d="M 675 718 C 675 500, 625 250, 625 194" class="port"/>

  <rect x="88" y="95" width="285" height="24" fill="#f8fafc"/>
  <text x="88" y="113" class="layer-note">依赖方向：上层调用下层能力</text>
  <text x="930" y="744" class="layer-note">实线：业务调用</text>
  <text x="930" y="767" class="layer-note">虚线：技术接口连接</text>

</svg>
