<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Work With Agent 项目工作闭环</title>
  <desc id="desc">从快速记录、补齐项目上下文、AI 接力到结果回流的个人工作闭环</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .kicker { font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #0F766E; }
      .title { font-size: 32px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-size: 16px; fill: #475569; }
      .card { stroke: #E2E8F0; stroke-width: 1.5; }
      .step { font-size: 12px; font-weight: 800; letter-spacing: 1px; }
      .card-title { font-size: 19px; font-weight: 750; fill: #0F172A; }
      .card-copy { font-size: 14px; fill: #475569; }
      .context-label { font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #5EEAD4; }
      .context-title { font-size: 25px; font-weight: 800; fill: #FFFFFF; }
      .context-copy { font-size: 15px; fill: #CBD5E1; }
      .chip-title { font-size: 14px; font-weight: 750; fill: #F8FAFC; }
      .chip-copy { font-size: 12px; fill: #94A3B8; }
      .trust { font-size: 13px; font-weight: 650; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#F8FAFC"/>
  <circle cx="1110" cy="52" r="3" fill="#14B8A6"/>
  <circle cx="1124" cy="52" r="3" fill="#F59E0B"/>
  <circle cx="1138" cy="52" r="3" fill="#F43F5E"/>

  <text x="72" y="54" class="kicker">WORK WITH AGENT</text>
  <text x="72" y="101" class="title">让每一次工作，都能接着上次继续</text>
  <text x="72" y="132" class="subtitle">把任务、材料、项目记忆和 AI 结果，放回同一个可持续推进的工作上下文。</text>

  <rect x="894" y="82" width="234" height="34" rx="17" fill="#ECFDF5" stroke="#A7F3D0"/>
  <circle cx="915" cy="99" r="5" fill="#0F766E"/>
  <text x="929" y="104" font-size="12" font-weight="750" fill="#115E59">LOCAL-FIRST · HUMAN-IN-THE-LOOP</text>

  <!-- 四步产品闭环 -->
  <g filter="url(#shadow)">
    <rect x="72" y="186" width="238" height="150" rx="16" fill="#EFF6FF" class="card"/>
    <rect x="330" y="186" width="238" height="150" rx="16" fill="#F0FDFA" class="card"/>
    <rect x="588" y="186" width="238" height="150" rx="16" fill="#FFF7ED" class="card"/>
    <rect x="846" y="186" width="238" height="150" rx="16" fill="#FFF1F2" class="card"/>
  </g>

  <circle cx="105" cy="222" r="16" fill="#DBEAFE"/>
  <text x="105" y="226" text-anchor="middle" class="step" fill="#1D4ED8">01</text>
  <text x="132" y="228" class="card-title">快速记录</text>
  <text x="96" y="266" class="card-copy">收集想法、任务和材料，</text>
  <text x="96" y="288" class="card-copy">先记下来，不被整理打断。</text>
  <text x="96" y="316" font-size="12" font-weight="700" fill="#2563EB">Inbox · Today · Search</text>

  <circle cx="363" cy="222" r="16" fill="#CCFBF1"/>
  <text x="363" y="226" text-anchor="middle" class="step" fill="#0F766E">02</text>
  <text x="390" y="228" class="card-title">补齐上下文</text>
  <text x="354" y="266" class="card-copy">连接项目、目标、决策和</text>
  <text x="354" y="288" class="card-copy">完成标准，知道为何而做。</text>
  <text x="354" y="316" font-size="12" font-weight="700" fill="#0F766E">Projects · Materials · Memory</text>

  <circle cx="621" cy="222" r="16" fill="#FED7AA"/>
  <text x="621" y="226" text-anchor="middle" class="step" fill="#C2410C">03</text>
  <text x="648" y="228" class="card-title">正式接力</text>
  <text x="612" y="266" class="card-copy">把带背景的任务交给你</text>
  <text x="612" y="288" class="card-copy">或受控 Agent，明确验收标准。</text>
  <text x="612" y="316" font-size="12" font-weight="700" fill="#C2410C">Handoff · Approval · Run</text>

  <circle cx="879" cy="222" r="16" fill="#FFE4E6"/>
  <text x="879" y="226" text-anchor="middle" class="step" fill="#BE123C">04</text>
  <text x="906" y="228" class="card-title">结果回流</text>
  <text x="870" y="266" class="card-copy">验收成果、沉淀经验，</text>
  <text x="870" y="288" class="card-copy">留下下一步，而不是结束在聊天里。</text>
  <text x="870" y="316" font-size="12" font-weight="700" fill="#BE123C">Artifacts · Review · Next step</text>

  <path d="M310 261H322" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M568 261H580" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M826 261H838" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 共同上下文 -->
  <path d="M191 336V378" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <path d="M449 336V378" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <path d="M707 336V378" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <path d="M965 336V378" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="378" width="1056" height="218" rx="22" fill="#0F172A"/>
  </g>
  <rect x="104" y="410" width="238" height="28" rx="14" fill="#134E4A"/>
  <text x="223" y="429" text-anchor="middle" class="context-label">ONE PROJECT CONTEXT</text>
  <text x="104" y="478" class="context-title">同一个项目上下文</text>
  <text x="104" y="508" class="context-copy">每次接手，都从最新且可追溯的状态开始。</text>
  <text x="104" y="532" class="context-copy">人和 AI 可以轮流工作，但项目不会失忆。</text>
  <path d="M400 414V560" stroke="#334155" stroke-width="1"/>

  <rect x="438" y="410" width="294" height="62" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="464" cy="441" r="15" fill="#1D4ED8"/>
  <text x="464" y="446" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">T</text>
  <text x="492" y="438" class="chip-title">任务与目标</text>
  <text x="492" y="458" class="chip-copy">下一步、完成标准、阻塞原因</text>

  <rect x="750" y="410" width="294" height="62" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="776" cy="441" r="15" fill="#0F766E"/>
  <text x="776" y="446" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">M</text>
  <text x="804" y="438" class="chip-title">材料与决策</text>
  <text x="804" y="458" class="chip-copy">来源、版本、关键约束与依据</text>

  <rect x="438" y="486" width="294" height="62" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="464" cy="517" r="15" fill="#D97706"/>
  <text x="464" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">R</text>
  <text x="492" y="514" class="chip-title">项目记忆</text>
  <text x="492" y="534" class="chip-copy">当前有效的事实、经验与历史</text>

  <rect x="750" y="486" width="294" height="62" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="776" cy="517" r="15" fill="#BE123C"/>
  <text x="776" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">A</text>
  <text x="804" y="514" class="chip-title">成果与下一步</text>
  <text x="804" y="534" class="chip-copy">可验收产物、复盘与后续行动</text>

  <!-- 闭环回流 -->
  <path d="M1084 261C1150 292 1152 390 1108 420" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowAccent)"/>
  <text x="1090" y="352" font-size="12" font-weight="750" fill="#0F766E" transform="rotate(90 1090 352)">持续推进</text>

  <!-- 信任点 -->
  <rect x="72" y="646" width="1056" height="54" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="106" cy="673" r="6" fill="#0F766E"/>
  <text x="122" y="678" class="trust">本地优先</text>
  <path d="M245 660V686" stroke="#E2E8F0"/>
  <circle cx="278" cy="673" r="6" fill="#D97706"/>
  <text x="294" y="678" class="trust">AI 提议，用户确认</text>
  <path d="M509 660V686" stroke="#E2E8F0"/>
  <circle cx="542" cy="673" r="6" fill="#BE123C"/>
  <text x="558" y="678" class="trust">结果可追溯</text>
  <path d="M715 660V686" stroke="#E2E8F0"/>
  <text x="748" y="678" font-size="13" fill="#64748B">Work With Agent · Your project keeps moving</text>
</svg>
