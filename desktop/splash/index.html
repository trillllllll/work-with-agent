<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Dovun</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas;
      --surface: color-mix(in srgb, CanvasText 6%, Canvas);
      --line: color-mix(in srgb, CanvasText 14%, Canvas);
      --text: CanvasText;
      --muted: color-mix(in srgb, CanvasText 55%, Canvas);
      --accent: #38BDF8;
      --danger: #FB7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    #status { color: var(--muted); font-size: 14px; }
    .hidden { display: none !important; }
    .modes { display: grid; gap: 10px; margin: 16px 0; }
    label.mode {
      display: flex; gap: 10px; align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    label.mode:has(input:checked) { border-color: var(--accent); }
    label.mode input { margin-top: 4px; accent-color: var(--accent); }
    label.mode strong { display: block; font-size: 14px; }
    label.mode span { color: var(--muted); font-size: 12px; }
    input[type="url"], input[type="text"] {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #06202e;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 400;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #error {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--text);
      font-size: 13px;
      word-break: break-all;
    }
    .notice { margin-top: 10px; color: var(--muted); font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <img src="dovun.svg" alt="" width="58" height="58" style="margin:0 auto 16px;display:block"><h1>Dovun</h1>
    <p id="status" data-i18n="startingLocal">正在启动本机服务…</p>

    <div id="error-card" class="hidden">
      <p id="error"></p>
      <button id="retry" type="button" data-i18n="retry">重试</button>
    </div>
  </main>

  <script>
    const Tauri = window.__TAURI__;
    // The launcher follows the system language: English for en-*, Chinese otherwise.
    const english = (navigator.language || '').toLowerCase().startsWith('en');
    const messages = {
      startingLocal: 'Starting the local service…',
      pickerTitle: 'Choose where your workspace data lives.',
      localTitle: 'Local mode',
      localBody: 'Data stays on this computer and is never uploaded.',
      remoteTitle: 'Connect to a server',
      remoteBody: 'Share one copy of your data across devices (self-hosted server).',
      apply: 'Start',
      remoteNote: 'Once connected, this computer stops using its local data. Switch back any time from Server in the app.',
      retry: 'Retry',
      openLauncher: 'Open launcher',
      firstRun: 'First launch: please choose a mode.',
      switching: 'Switch workspace mode.',
      connecting: (url) => `Connecting to ${url}…`,
      retrying: 'Retrying…',
    };
    const zh = {
      firstRun: '首次使用，请先做一次选择。',
      switching: '切换工作区模式。',
      connecting: (url) => `正在连接 ${url}…`,
      retrying: '正在重试…',
      startingLocal: '正在启动本机服务…',
    };
    const text = (key, ...args) => { const value = english ? messages[key] : zh[key]; return typeof value === 'function' ? value(...args) : value; };
    if (english) {
      document.documentElement.lang = 'en';
      document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = messages[node.dataset.i18n]; });
    }
    const $status = document.getElementById('status');
    const $error = document.getElementById('error-card');
    const $errorText = document.getElementById('error');

    document.getElementById('retry').addEventListener('click', async () => {
      if (!Tauri) return;
      $error.classList.add('hidden');
      $status.textContent = text('retrying');
      try { await Tauri.core.invoke('launcher_retry'); }
      catch (error) { $errorText.textContent = String(error); $error.classList.remove('hidden'); }
    });


    window.dovunLaunchError = (message) => {
      $status.textContent = '';
      $errorText.textContent = message;
      $error.classList.remove('hidden');
    };


  </script>
</body>
</html>
