<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Work With Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: Canvas;
      --surface: color-mix(in srgb, CanvasText 6%, Canvas);
      --line: color-mix(in srgb, CanvasText 14%, Canvas);
      --text: CanvasText;
      --muted: color-mix(in srgb, CanvasText 55%, Canvas);
      --accent: #38BDF8;
      --danger: #FB7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    #status { color: var(--muted); font-size: 14px; }
    .hidden { display: none !important; }
    .modes { display: grid; gap: 10px; margin: 16px 0; }
    label.mode {
      display: flex; gap: 10px; align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    label.mode:has(input:checked) { border-color: var(--accent); }
    label.mode input { margin-top: 4px; accent-color: var(--accent); }
    label.mode strong { display: block; font-size: 14px; }
    label.mode span { color: var(--muted); font-size: 12px; }
    input[type="url"], input[type="text"] {
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      margin-top: 14px;
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #06202e;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 400;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #error {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      background: color-mix(in srgb, var(--danger) 10%, transparent);
      color: var(--text);
      font-size: 13px;
      word-break: break-all;
    }
    .notice { margin-top: 10px; color: var(--muted); font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Work With Agent</h1>
    <p id="status">正在启动本机服务…</p>

    <form id="picker" class="hidden">
      <p class="sub" id="picker-title">选择工作区数据存放的位置。</p>
      <div class="modes">
        <label class="mode">
          <input type="radio" name="mode" value="local" checked>
          <span><strong>本机模式</strong><span>数据保存在这台电脑，不上传。</span></span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" value="remote">
          <span><strong>连接服务器</strong><span>多台设备共用一份云端数据（自托管服务器）。</span></span>
        </label>
      </div>
      <input id="remote-url" type="url" class="hidden" placeholder="https://wwa.example.com" spellcheck="false" autocomplete="off">
      <button id="picker-apply" type="submit">启动</button>
      <p class="notice hidden" id="picker-note">连接后此电脑不再使用本机数据；可随时通过应用内的「服务器」入口切回。</p>
    </form>

    <div id="error-card" class="hidden">
      <p id="error"></p>
      <button id="retry" type="button">重试</button>
      <button id="switch" class="secondary" type="button">打开启动器</button>
    </div>
  </main>

  <script>
    const Tauri = window.__TAURI__;
    const $status = document.getElementById('status');
    const $picker = document.getElementById('picker');
    const $error = document.getElementById('error-card');
    const $errorText = document.getElementById('error');

    function showPicker(config) {
      $picker.classList.remove('hidden');
      $error.classList.add('hidden');
      const url = document.getElementById('remote-url');
      if (config && config.remoteUrl) url.value = config.remoteUrl;
      if (config && config.mode === 'remote') {
        document.querySelector('input[value="remote"]').checked = true;
        url.classList.remove('hidden');
      }
    }

    async function init() {
      if (!Tauri) return; // The dev splash server has no shell bridge.
      let config = null;
      try { config = await Tauri.core.invoke('launcher_config_get'); } catch { return; }
      const switching = new URLSearchParams(location.search).get('switch') === '1';
      if (!config) {
        $status.textContent = '首次使用，请先做一次选择。';
        showPicker(null);
      } else if (switching) {
        $status.textContent = '切换工作区模式。';
        showPicker(config);
      }
    }

    document.querySelectorAll('input[name="mode"]').forEach((radio) => {
      radio.addEventListener('change', () => {
        const remote = document.querySelector('input[value="remote"]').checked;
        document.getElementById('remote-url').classList.toggle('hidden', !remote);
        document.getElementById('picker-note').classList.toggle('hidden', !remote);
      });
    });

    document.getElementById('picker').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!Tauri) return;
      const remote = document.querySelector('input[value="remote"]').checked;
      const url = document.getElementById('remote-url').value.trim();
      const apply = document.getElementById('picker-apply');
      apply.disabled = true;
      try {
        if (remote) await Tauri.core.invoke('launcher_config_set', { mode: 'remote', remoteUrl: url });
        else await Tauri.core.invoke('launcher_config_set', { mode: 'local', remoteUrl: '' });
        await Tauri.core.invoke('launcher_retry');
        $picker.classList.add('hidden');
        $status.textContent = remote ? `正在连接 ${url}…` : '正在启动本机服务…';
      } catch (error) {
        $errorText.textContent = String(error);
        $error.classList.remove('hidden');
      } finally {
        apply.disabled = false;
      }
    });

    document.getElementById('retry').addEventListener('click', async () => {
      if (!Tauri) return;
      $error.classList.add('hidden');
      $status.textContent = '正在重试…';
      try { await Tauri.core.invoke('launcher_retry'); }
      catch (error) { $errorText.textContent = String(error); $error.classList.remove('hidden'); }
    });
    document.getElementById('switch').addEventListener('click', () => { $error.classList.add('hidden'); showPicker(null); });

    window.wwaLaunchError = (message) => {
      $status.textContent = '';
      $errorText.textContent = message;
      $error.classList.remove('hidden');
    };

    init();
  </script>
</body>
</html>
