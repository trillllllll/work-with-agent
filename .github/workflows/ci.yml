name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Prepare unit-test database
        run: mkdir -p server/data && npm run db:migrate
        env:
          DATABASE_URL: file:../data/ci-test.db
      - run: npm test
        env:
          DATABASE_URL: file:../data/ci-test.db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
