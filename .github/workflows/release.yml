name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并挂载的 Release 标签（留空则用最新 Release）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 解析 Release 标签
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [ -z "$TAG" ]; then TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"; fi
          if [ -z "$TAG" ]; then echo "找不到 Release 标签" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run desktop:build
      - name: 上传 dmg 到 Release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" desktop/src-tauri/target/release/bundle/dmg/*.dmg --clobber

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 解析 Release 标签
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"; fi
          if [ -z "$TAG" ]; then TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"; fi
          if [ -z "$TAG" ]; then echo "找不到 Release 标签" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run desktop:build:windows
      - run: npm run desktop:smoke
      - name: 上传 exe 到 Release
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber
