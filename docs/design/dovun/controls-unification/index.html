<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dovun · 样式统一验收</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#303a46;background:#f1f0eb}*{box-sizing:border-box}body{margin:0;padding:32px}header,main{max-width:1500px;margin:auto}h1{font-size:28px;letter-spacing:-.8px}p{line-height:1.6;color:#626d77;font-size:14px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}button,a{font:inherit;font-size:14px;border:1px solid #bbc0c5;border-radius:8px;padding:9px 14px;background:#faf9f5;color:#303a46;text-decoration:none}button[aria-pressed=true]{background:#354d85;color:white}button:focus-visible,a:focus-visible{outline:2px solid #354d85;outline-offset:3px}section{margin:36px 0}h2{font-size:18px}img{display:block;width:100%;height:auto;border:1px solid #c8cdcf;border-radius:12px;box-shadow:0 6px 20px #303a4615}.phone img{max-width:390px}small{font-size:12px;color:#626d77}details{padding:16px;background:#faf9f5;border:1px solid #d5d8da;border-radius:12px}li{margin:10px 0;line-height:1.5}@media(max-width:640px){body{padding:18px}h1{font-size:24px}}
</style><header><small>DOVUN / IMPLEMENTATION</small><h1>全系统控件样式统一</h1><p>下面是隔离数据下运行的真实应用截图。默认控件材质，基础字号 14px；任务密度方案未应用。本机安装与服务器部署未执行。</p><nav aria-label="截图设置"><button data-theme="light" aria-pressed="true">浅色</button><button data-theme="dark" aria-pressed="false">深色</button><button data-width="1586" aria-pressed="true">桌面</button><button data-width="390" aria-pressed="false">390px 手机</button><a href="http://127.0.0.1:5188/controls.html" target="_blank">打开真实控件预览</a><a href="README.md">实施与验收记录</a></nav><details><summary>范围与阅读方式</summary><ul><li>浅深色共用布局；桌面和手机切换仅切换截图。</li><li>按钮轻微承托、输入框内凹、卡片边缘与独立浮层已接入共用变量。</li><li>深色辅助文字与链接为满足对比度小幅提亮，按钮填充沿用原参数。</li><li>截图展示页面与空状态；完整功能回归结果以验收记录为准。</li></ul></details></header><main><section><h2>今天</h2><img data-page="today" src="evidence/today-light-1586.png" alt="今天真实页面截图" loading="lazy"></section><section><h2>规划</h2><img data-page="plan" src="evidence/plan-light-1586.png" alt="规划真实页面截图" loading="lazy"></section><section><h2>资料库</h2><img data-page="library" src="evidence/library-light-1586.png" alt="资料库真实页面截图" loading="lazy"></section><section><h2>工作上下文</h2><img data-page="knowledge-brief" src="evidence/knowledge-brief-light-1586.png" alt="工作上下文真实页面截图" loading="lazy"></section><section><h2>待确认</h2><img data-page="proposals" src="evidence/proposals-light-1586.png" alt="待确认真实页面截图" loading="lazy"></section><section><h2>设置</h2><img data-page="settings" src="evidence/settings-light-1586.png" alt="设置真实页面截图" loading="lazy"></section></main><script>let theme='light',width='1586';for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>{if(b.dataset.theme)theme=b.dataset.theme;if(b.dataset.width)width=b.dataset.width;for(const x of document.querySelectorAll('button[data-theme]'))x.setAttribute('aria-pressed',x.dataset.theme===theme);for(const x of document.querySelectorAll('button[data-width]'))x.setAttribute('aria-pressed',x.dataset.width===width);document.querySelector('main').classList.toggle('phone',width==='390');for(const img of document.querySelectorAll('img[data-page]'))img.src='evidence/'+img.dataset.page+'-'+theme+'-'+width+'.png'});</script></html>
