<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dovun 视觉效果图对比</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#e8ebf0;background:#171b22;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:20px;justify-content:space-between;flex-wrap:wrap;padding:18px 26px;border-bottom:1px solid #343a46}h1{font-size:17px;letter-spacing:-.4px;margin:0}small{font-size:11px;color:#a6aebc}nav{display:flex;gap:6px;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid transparent;border-radius:8px;background:transparent;color:#b3bbc8;padding:8px 14px;cursor:pointer}button:hover{background:#29303d}button[aria-pressed=true]{background:#e8edf6;color:#263958}button:focus-visible,a:focus-visible{outline:2px solid #a4bdeb;outline-offset:3px}main{padding:24px;max-width:1760px;margin:auto}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:12px;background:#252b35;box-shadow:0 12px 55px #0004}figcaption{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:18px 2px 0}h2{font-size:16px;margin:0 0 4px}p{color:#aeb7c6;margin:0;font-size:12px}a{color:#c2d2f3;text-underline-offset:4px;white-space:nowrap;font-size:12px}.note{margin-top:22px;color:#7f8a9c;font-size:11px}@media(max-width:650px){header{padding:14px 16px;gap:12px}main{padding:16px 10px}button{padding:7px 10px;font-size:12px}figcaption{padding:0 6px}img{border-radius:7px}}
</style>
</head>
<body>
<header><div><h1>Dovun 视觉效果图</h1><small>内置图像生成 · 方向探索</small></div><nav aria-label="选择视觉方向"><button data-id="a-porcelain" aria-pressed="true">A 温润浅色</button><button data-id="b-ink" aria-pressed="false">B 深墨层次</button><button data-id="c-editorial" aria-pressed="false">C 双栏工作台</button></nav></header>
<main><figure><img id="visual" src="a-porcelain.png" alt="A 温润浅色 Dovun 个人工作台效果图"><figcaption><div><h2 id="title">A 温润浅色</h2><p id="description">温白表面、细腻阴影和内嵌工作区，让任务、资料与助手形成清楚的层次。</p></div><a id="original" href="a-porcelain.png" target="_blank" rel="noopener">打开原图</a></figcaption></figure><p class="note">三张均为 AI 生成的静态效果图，尚未实现。正式功能范围仍按个人工作台计划执行。</p></main>
<script>
const variants={
 'a-porcelain':{title:'A 温润浅色',description:'温白表面、细腻阴影和内嵌工作区，让任务、资料与助手形成清楚的层次。'},
 'b-ink':{title:'B 深墨层次',description:'石墨与墨蓝的深浅叠层，以柔和高光和克制的珊瑚色建立暗色质感。'},
 'c-editorial':{title:'C 双栏工作台',description:'深蓝侧栏与白色工作区形成对比，任务、日程和资料的组织更鲜明。'}
};
function select(id){if(!variants[id])return;const item=variants[id];document.getElementById('visual').src=id+'.png';document.getElementById('visual').alt=item.title+' Dovun 个人工作台效果图';document.getElementById('original').href=id+'.png';document.getElementById('title').textContent=item.title;document.getElementById('description').textContent=item.description;document.querySelectorAll('[data-id]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.id===id)));history.replaceState(null,'','#'+id)}
document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>select(button.dataset.id)));
if(variants[location.hash.slice(1)])select(location.hash.slice(1));
document.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;const ids=Object.keys(variants),current=document.querySelector('[aria-pressed=true]').dataset.id;select(ids[(ids.indexOf(current)+(event.key==='ArrowRight'?1:2))%3]);});
</script>
</body>
</html>
