  <style>
/* styles.css */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { color: var(--text); background: var(--canvas); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: not-allowed; opacity: .5; }
button, input, textarea, select { touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button svg { pointer-events: none; }
button { border: 0; background: none; }
svg.icon { width: 20px; height: 20px; display: block; flex: 0 0 auto; stroke-width: 1.7; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.demo-bar { max-width: 1120px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px; color: var(--muted); font-size: 11px; letter-spacing: .03em; }
.demo-brand { display: flex; gap: 10px; align-items: center; }
.brand-mark { width: 17px; height: 17px; display: inline-flex; gap: 3px; align-items: flex-end; }
.brand-mark i { width: 4px; height: 15px; background: var(--accent); border-radius: 1px; }
.brand-mark i:nth-child(2) { height: 10px; opacity: .65; }
.brand-mark i:nth-child(3) { height: 6px; opacity: .4; }
.demo-bar button { font-size: 11px; min-height: 32px; padding: 0 8px; color: var(--muted); }
.demo-actions { display: flex; align-items: center; gap: 8px; }
.app-shell { max-width: 1120px; margin: 0 auto; height: calc(100dvh - 76px); min-height: 580px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 288px; }
.primary { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.page-header { flex: 0 0 auto; padding: 23px 26px 0; border-bottom: 1px solid var(--line); }
.date-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.eyebrow { font-size: 11px; line-height: 17px; color: var(--muted); letter-spacing: .07em; margin-bottom: 3px; }
.date-title { font-size: 22px; line-height: 30px; font-weight: 600; margin: 0; padding: 0; text-align: left; white-space: nowrap; letter-spacing: -.025em; min-height: 32px; }
.date-actions { display: flex; align-items: center; gap: 0; }
.icon-button { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-control); flex-shrink: 0; color: var(--icon-ink); }
.icon-button:hover { background: var(--line-soft); color: var(--text); }
.icon-button.selected { background: var(--accent-soft); color: var(--accent); }
.text-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; gap: 6px; font-size: 13px; font-weight: 500; border-radius: var(--radius-control); }
.text-button:hover { background: var(--line-soft); }
.today-button { color: var(--accent); padding: 0 10px; }
.toolbar-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 13px; height: 51px; }
.view-switch { display: flex; align-items: stretch; height: 100%; gap: 8px; }
.view-tab { font-size: 13px; color: var(--muted); min-width: 44px; min-height: 44px; position: relative; }
  .view-tab span { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 14px; border-radius: 8px; }
.view-tab[aria-pressed=true] { color: var(--accent); font-weight: 600; }
.view-tab[aria-pressed=true]::after { content: ''; position: absolute; bottom: -1px; height: 2px; background: var(--accent); left: 12px; right: 12px; }
.toolbar-actions { display: flex; align-items: center; gap: 2px; }
.backlog-button { color: var(--text); gap: 6px; }
.backlog-button .count { color: var(--muted); font-size: 12px; }
.add-button { color: var(--accent); }
.page-body { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; position: relative; overscroll-behavior: contain; }
.timeline { position: relative; height: calc(24 * var(--hour-height) + 24px); margin-right: 20px; }
.time-grid { position: absolute; inset: 0; pointer-events: none; }
.hour-row { position: absolute; left: 0; width: 100%; height: var(--hour-height); }
.hour-row::before { content: ''; position: absolute; left: var(--time-gutter); right: 0; height: 1px; background: var(--line); }
.hour-row:not(:last-child)::after { content: ''; position: absolute; top: 50%; left: var(--time-gutter); right: 0; height: 1px; background: var(--line-soft); }
.hour-label { position: absolute; left: 10px; top: 4px; color: var(--muted); font-size: 11px; line-height: 16px; font-variant-numeric: tabular-nums; }
.band-stage, .task-stage { position: absolute; left: var(--time-gutter); right: 0; top: 0; bottom: 24px; }
.band-stage { pointer-events: none; }
.time-band { position: absolute; left: 0; right: 0; background: var(--work); border-left: 2px solid var(--edge-work); }
.time-band.commute { background: var(--commute); border-left-color: var(--edge-commute); }
.time-band .band-context { writing-mode: vertical-rl; text-orientation: upright; position: absolute; left: 3px; top: 10px; font-size: 10px; line-height: 14px; letter-spacing: 1px; color: var(--muted); }
.time-band .band-free { position: absolute; left: 14px; top: 14px; color: var(--commute-ink); display: flex; align-items: baseline; gap: 12px; z-index: 1; }
.band-free strong { display: block; font-size: 15px; font-weight: 500; margin-bottom: 0; }
.band-free span { font-size: 12px; font-variant-numeric: tabular-nums; background: var(--commute); padding-right: 4px; }
.task-group { position: absolute; left: var(--context-gutter); right: 0; }
.task-slot { position: absolute; }
.task-item { width: 100%; height: calc(100% - 3px); border-radius: var(--radius-task); background: var(--surface); border-left: 2px solid var(--edge-rail); overflow: hidden; position: relative; }
.task-open { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 10px 12px; }
.task-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.task-check { position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; max-height: calc(100% - 4px); display: inline-flex; align-items: center; justify-content: center; border-radius: 0 0 8px 0; }
.task-check .status-dot { width: 18px; height: 18px; margin: 0; }
.task-check:hover { background: var(--accent-soft); }
.task-check:hover .status-dot { border-color: var(--accent); }
.task-check:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.task-item:hover { background: var(--card-hover-bg); }
.task-item .task-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 22px; font-weight: 500; overflow-wrap: anywhere; flex-shrink: 0; }
.task-item .task-time { margin-top: 5px; display: flex; gap: 5px; align-items: center; font-size: 12px; line-height: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.task-item .task-note { color: var(--muted); font-size: 12px; line-height: 19px; margin-top: auto; padding-top: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.task-item.done { color: var(--muted); border-left-color: var(--edge-rail-muted); background: var(--card-done-bg); }
.task-item.is-selected { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); border-left-color: var(--accent); }
.task-item.compact .task-open { padding: 4px 8px; }
.task-item.compact .task-name { font-size: 14px; line-height: 19px; }
.task-item.compact .task-time, .task-item.compact .task-note { display: none; }
.task-item.micro .task-open { padding: 2px 6px; }
.task-item.micro .task-name { -webkit-line-clamp: 1; font-size: 12px; line-height: 16px; }
.task-item.micro .task-time, .task-item.micro .task-note { display: none; }
.overflow-slot { position: absolute; right: 0; width: 44px; }
.overflow-button { height: calc(100% - 3px); width: 100%; border-radius: 4px; color: var(--overflow-ink); background: var(--overflow-bg); font-size: 12px; padding: 0; display: flex; align-items: center; justify-content: center; }
.overflow-button:hover { background: var(--overflow-hover); color: var(--accent); }
.now-line { position: absolute; left: 0; right: 0; z-index: 4; border-top: 1px solid var(--accent); pointer-events: none; }
.now-line::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; position: absolute; top: -3.5px; left: -3px; }
.now-label { position: absolute; right: 4px; top: -19px; color: var(--accent); background: var(--surface); font-size: 10px; padding: 2px 4px; font-variant-numeric: tabular-nums; }
.empty-day { position: absolute; top: calc(8.5 * var(--hour-height)); left: calc(var(--time-gutter) + 20px); right: 20px; text-align: center; padding: 22px 8px; background: var(--surface); }
.empty-day p { color: var(--muted); font-size: 13px; line-height: 22px; margin: 6px 0 12px; }
.primary-button { min-height: 44px; border-radius: 6px; padding: 10px 18px; background: var(--accent); color: var(--primary-ink); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

/* layout.js */
/** Pure time-layout functions. The UI never shifts start/end times to fit cards. */
(function (root) {
  'use strict';
  const rootStyle = typeof getComputedStyle === 'function' ? getComputedStyle(document.documentElement) : null;
  const cssHour = rootStyle ? parseFloat(rootStyle.getPropertyValue('--hour-height')) : NaN;
  const HOUR_HEIGHT = Number.isFinite(cssHour) && cssHour > 0 ? cssHour : 96;
  const px = minutes => minutes * HOUR_HEIGHT / 60;
  const overlaps = (a, b) => a.start < b.end && b.start < a.end;

  /** Connected interval groups; touching endpoints do not overlap. */
  function groupIntervals(tasks) {
    const sorted = [...tasks].sort((a, b) => a.start - b.start || b.end - a.end || a.id.localeCompare(b.id));
    const groups = [];
    for (const task of sorted) {
      let group = groups[groups.length - 1];
      if (!group || task.start >= group.end) {
        group = { start: task.start, end: task.end, tasks: [] };
        groups.push(group);
      }
      group.end = Math.max(group.end, task.end);
      group.tasks.push(task);
    }
    return groups;
  }

  /**
   * At most two readable task columns. Unfinished tasks receive display priority.
   * Extra tasks retain their own true times in an explicit overflow rail.
   * This is a deterministic UI heuristic, not an optimal interval scheduler.
   */
  function layoutTasks(tasks, maxColumns = 2) {
    if (!Number.isInteger(maxColumns) || maxColumns < 1) throw new Error('maxColumns must be positive');
    return groupIntervals(tasks).map(group => {
      const lanes = Array.from({ length: maxColumns }, () => []);
      const placed = [];
      const hidden = [];
      const ordered = [...group.tasks].sort((a, b) => Number(a.done) - Number(b.done) || a.start - b.start || b.end - a.end || a.id.localeCompare(b.id));
      for (const task of ordered) {
        const lane = lanes.findIndex(items => items.every(other => !overlaps(task, other)));
        if (lane < 0) hidden.push(task);
        else { lanes[lane].push(task); placed.push({ task, lane }); }
      }
      const columns = Math.max(1, ...placed.map(item => item.lane + 1));
      const boundaries = [...new Set(hidden.flatMap(task => [task.start, task.end]))].sort((a,b) => a-b);
      const overflow = [];
      for (let i = 0; i < boundaries.length - 1; i++) {
        const start = boundaries[i], end = boundaries[i + 1];
        const ids = hidden.filter(task => task.start < end && task.end > start).map(task => task.id).sort();
        if (!ids.length) continue;
        const last = overflow[overflow.length - 1];
        if (last && last.end === start && last.ids.join('|') === ids.join('|')) last.end = end;
        else overflow.push({ start, end, ids });
      }
      return { ...group, placed, hidden, columns, overflow };
    });
  }
  const api = Object.freeze({ HOUR_HEIGHT, px, overlaps, groupIntervals, layoutTasks });
  root.ScheduleLayout = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window === 'undefined' ? globalThis : window);

      <section class="gallery-section"><h3><small>01</small>一张任务卡，四种状态</h3><div class="spec-tasks">${[['普通','微微浮起',{},task],['选中','靠近一层',{selected:true},task],['已完成','回落底面',{}, {...task,done:true}],['紧凑','时长不变',{compact:true},{...task,title:'梳理待办',start:660,end:690}]].map(([label,note,options,item])=>`<div class="spec-task-wrap"><div class="spec-task-label">${label}<small>${note}</small></div><div class="spec-task-canvas ${options.compact?'short':''}">${TaskItem(item,{...options,preview:true})}</div></div>`).join('')}</div><p class="gallery-note">高光和阴影只改变表面，不改变卡片的位置与高度。短任务不为装下文字而延长；已完成不整块透明。</p></section>

  <script>
/* app.js */
/** Demo application: state, local persistence, accessible dialogs, event routing. */
(function () {
  'use strict';
  const C = window.ScheduleComponents;
  const { esc, time, dateKey, localDate, dateTitle, Icon, IconButton } = C;
  const { SAMPLE_DATE, initialData } = window.ScheduleData;
  const STORAGE_KEY = 'dayline-porcelain-demo-v1';
  const app = document.getElementById('app');
  const modal = document.getElementById('modal');
  const toastNode = document.getElementById('toast');
  let toastTimer, previousFocus, selectedId = null;
  let storageOK = true;
  const openingScroll = () => ScheduleLayout.px(480) - 10;
  let pendingScroll = openingScroll();

  const THEME_KEY = 'dayline-porcelain-theme';
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#1E242B' : '#f7f5ef');
    const toggle = document.getElementById('theme-toggle');
    if (toggle) toggle.textContent = theme === 'dark' ? '浅色' : '深色';
  }
  applyTheme((() => {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (_) {}
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  })());

  function validDate(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const date = localDate(value);
    return Number.isFinite(date.getTime()) && dateKey(date) === value;
  }
  function validInterval(item) {
    return item && typeof item.id === 'string' && typeof item.title === 'string' &&
      validDate(item.date) && Number.isInteger(item.start) && Number.isInteger(item.end) &&
      item.start >= 0 && item.end <= 1440 && item.start < item.end;
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return initialData();
      const saved = JSON.parse(raw);
      if (saved.version !== 1 || !validDate(saved.date) ||
          !Array.isArray(saved.tasks) || !saved.tasks.every(t => validInterval(t) && typeof t.done === 'boolean') ||
          !Array.isArray(saved.bands) || !saved.bands.every(validInterval) ||
          !Array.isArray(saved.backlog) || !saved.backlog.every(t => typeof t.id === 'string' && typeof t.title === 'string') ||
          !['day', 'week', 'month'].includes(saved.view) || !['schedule', 'tasks', 'components'].includes(saved.page) ||
          typeof saved.showCompleted !== 'boolean' || typeof saved.showBands !== 'boolean' ||
          new Set(saved.tasks.map(t => t.id)).size !== saved.tasks.length) return initialData();

  function save() {

  }
  function render({ keepScroll = false, focusSelector = null } = {}) {
    const oldBody = document.getElementById('page-body');
    const oldScroll = keepScroll && oldBody ? oldBody.scrollTop : null;
    const content = state.page === 'components' ? C.ComponentGallery() :
      state.page === 'tasks' ? C.TaskList(state) :
      state.view === 'day' ? C.TimeGrid(state) :
      state.view === 'week' ? C.WeekView(state) : C.MonthView(state);
    app.innerHTML = `<div class="app-shell"><div class="primary">${C.DateToolbar(state)}<main id="page-body" class="page-body" aria-label="${state.page === 'components' ? '组件预览' : state.page === 'tasks' ? '当日任务列表' : '日程内容'}" tabindex="-1">${content}</main>${C.BottomNav(state.page)}</div>${C.DayPanel({...state, storageAvailable: storageOK})}</div>`;
    const body = document.getElementById('page-body');
    if (oldScroll !== null) body.scrollTop = oldScroll;
    else if (state.page === 'schedule' && state.view === 'day') body.scrollTop = pendingScroll;
    else body.scrollTop = 0;

  }
  function changed(options = {}) { save(); render(options); }
  function scrollToMinute(minute) {

  }
  function openModal(title, content, focusSelector = null) {
    if (!modal.open) previousFocus = document.activeElement;
    modal.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2>${IconButton('close', '关闭', 'close')}</div><div class="dialog-content">${content}</div>`;

    if (focusSelector) modal.querySelector(focusSelector)?.focus();
  }
  function closeModal() {
    modal.close();
  }

    document.querySelectorAll('.task-item.is-selected').forEach(node => {

    }
  });

  function openEditor(id = null, backlogId = null) {
    const task = id ? state.tasks.find(t => t.id === id) : null;
    const backlog = backlogId ? state.backlog.find(t => t.id === backlogId) : null;
    if (id && !task) return toast('这项任务已不存在。');
    if (backlogId && !backlog) return toast('这项待办已安排或移除。');

    if (id) document.querySelectorAll(`.task-item[data-id="${CSS.escape(id)}"]`).forEach(node => node.classList.add('is-selected'));

    openModal(task ? '任务详情' : backlog ? '安排待办' : '新建任务', `
      <form id="task-form" data-id="${esc(id || '')}" data-backlog="${esc(backlogId || '')}">
        <div class="form-field"><label for="task-title">任务名称</label><input id="task-title" name="title" maxlength="120" required value="${esc(value.title)}" placeholder="写下要做的事" autocomplete="off"></div>
        <div class="form-field"><label for="task-date">日期</label><input id="task-date" name="date" type="date" required value="${esc(value.date)}"></div>
        <div class="form-row"><div class="form-field"><label for="task-start">开始时间</label><input id="task-start" name="start" type="time" step="60" required value="${time(value.start)}"></div><div class="form-field"><label for="task-end">结束时间</label><input id="task-end" name="end" type="time" step="60" required value="${time(Math.min(value.end,1439))}"></div></div>
        <div class="form-field"><label for="task-note">备注（可选）</label><textarea id="task-note" name="note" maxlength="1000" rows="2">${esc(value.note || '')}</textarea></div>
        <label class="checkbox-label"><input type="checkbox" name="done" ${value.done ? 'checked' : ''}>已完成</label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="dialog-actions">${task ? `<button type="button" class="danger-button" data-action="delete-confirm" data-id="${esc(id)}">删除任务</button>` : '<button type="button" class="secondary-button" data-action="close">取消</button>'}<button type="submit" class="primary-button">${task ? '保存修改' : '加入日程'}</button></div>
      </form>`, task ? null : '#task-title');
  }
  function openBacklog() {
    openModal(`待安排 · ${state.backlog.length}`, `<p class="dialog-description">以下是原型中的示例待办。点击“安排”，为它指定日期和时间。</p>${state.backlog.length ? state.backlog.map(task => `<div class="backlog-row"><span>${esc(task.title)}</span><button type="button" class="text-button" data-action="schedule-backlog" data-id="${esc(task.id)}" aria-label="安排${esc(task.title)}">安排 ${Icon('right')}</button></div>`).join('') : '<p class="empty-text">所有示例待办都已安排。</p>'}`);
  }
  function openSettings() {
    openModal('显示设置', `<p class="dialog-description">只改变显示，不改变任务时间或完成记录。</p><label class="settings-row"><span>显示已完成任务<small>保留回顾信息，降低视觉强调。</small></span><input type="checkbox" data-setting="showCompleted" ${state.showCompleted ? 'checked' : ''}></label><label class="settings-row"><span>显示时间段背景<small>通勤、上班作为背景，不占任务列。</small></span><input type="checkbox" data-setting="showBands" ${state.showBands ? 'checked' : ''}></label><div class="dialog-actions"><button type="button" class="primary-button" data-action="close">完成</button></div>`);
  }
  function openAbout() {
    openModal('关于这个原型', `<p class="dialog-description">从整页角色出发，验证一套可复用的日程组件。</p><ul class="about-list"><li><strong>示例数据，不是账号数据。</strong>沿用截图中的日期和部分文字。地铁、上班、转正材料的时段来自截图，其余任务名称及具体时间为演示设置，不是对实际日程的还原。</li><li><strong>可以实际操作：</strong>切换日期、日／周／月概览、查看重叠、增改删任务、勾选完成、安排待办、调整显示。</li><li><strong>保存范围：</strong>仅当前浏览器的 localStorage，不登录、不联网、不修改真实任务软件。${storageOK ? '' : '当前浏览器未允许本地保存，关闭或刷新页面后修改可能丢失。'}</li><li><strong>未实现：</strong>拖拽改期、跨午夜任务、重复任务、通知、远端同步。周视图是列表式概览，不是完整七列时间轴。</li></ul><div class="dialog-actions"><button type="button" class="secondary-button" data-action="reset-confirm">恢复示例</button><button type="button" class="primary-button" data-action="close">知道了</button></div>`);
  }
  function openOverflow(start, end) {
    const tasks = state.tasks.filter(task => task.date === state.date && (state.showCompleted || !task.done) && task.start < end && task.end > start).sort((a,b)=>Number(a.done)-Number(b.done)||a.start-b.start);
    openModal('重叠任务', `<p class="dialog-description">${time(start)}—${time(end)} 期间共有 ${tasks.length} 项任务。以下完整显示它们的名称与各自时段；没有将重叠任务排成先后执行。</p>${tasks.map(task => C.TaskRow(task,false)).join('')}`);
  }
  function openDatePicker() {
    openModal('跳转日期', `<form id="date-form"><div class="form-field"><label for="goto-date">选择日期</label><input id="goto-date" name="date" type="date" value="${state.date}" required></div><div class="dialog-actions"><button type="button" class="text-button" data-action="sample-date">回到 11月3日示例</button><button type="submit" class="primary-button">查看</button></div></form>`);
  }
  function setDate(date) {
    if (!validDate(date)) return toast('请选择有效日期。');
    state.date = date; state.page = 'schedule';
    pendingScroll = openingScroll();
    changed();
  }
  function navigate(direction) {
    const day = localDate(state.date);
    if (state.view === 'month') {
      const wanted = day.getDate(); day.setDate(1); day.setMonth(day.getMonth() + direction);
      const last = new Date(day.getFullYear(),day.getMonth()+1,0).getDate();
      day.setDate(Math.min(wanted,last));
    } else day.setDate(day.getDate() + direction * (state.view === 'week' ? 7 : 1));
    setDate(dateKey(day));
    document.querySelector(`[data-action="${direction < 0 ? 'previous' : 'next'}"]`)?.focus({preventScroll:true});
  }
  function handleAction(button) {
    const action = button.dataset.action;
    const id = button.dataset.id;
    switch (action) {
      case 'close': closeModal(); break;
      case 'about': openAbout(); break;
      case 'theme': {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
        applyTheme(next);
        break;
      }
      case 'task': openEditor(id); break;
      case 'add': openEditor(); break;
      case 'backlog': openBacklog(); break;
      case 'schedule-backlog': openEditor(null,id); break;
      case 'settings': openSettings(); break;
      case 'pick-date': openDatePicker(); break;
      case 'overflow': openOverflow(Number(button.dataset.start),Number(button.dataset.end)); break;
      case 'previous': navigate(-1); break;
      case 'next': navigate(1); break;
      case 'today': {
        state.view = 'day'; setDate(dateKey(new Date()));
        const now = new Date(); scrollToMinute(Math.max(0,now.getHours()*60-30));
        document.querySelector('[data-action="today"]')?.focus({preventScroll:true});
        break;
      }
      case 'sample-date': {
        state.view = 'day'; setDate(SAMPLE_DATE);
        if (modal.open) closeModal();
        break;
      }
      case 'open-day': state.view='day'; setDate(button.dataset.date); break;
      case 'view': {
        state.view=button.dataset.view; state.page='schedule';
        changed({focusSelector:`.view-tab[data-view="${state.view}"]`}); break;
      }
      case 'page': {
        const currentBody = document.getElementById('page-body');
        if (state.page==='schedule' && state.view==='day') pendingScroll=currentBody.scrollTop;
        state.page=button.dataset.page;
        changed({focusSelector:`.nav-item[data-page="${state.page}"]`}); break;
      }
      case 'toggle': {
        const task=state.tasks.find(t=>t.id===id);
        if (!task) break;
        task.done=!task.done;
        changed({keepScroll:true,focusSelector:`[data-action="toggle"][data-id="${id}"]`});
        toast(task.done?'已标记完成':'已恢复为待处理'); break;
      }
      case 'delete-confirm': {
        const task=state.tasks.find(t=>t.id===id);
        if (!task) break;
        openModal('删除这项任务？', `<p class="dialog-description">${esc(task.title)}<br>只删除此原型中的任务；不会修改真实账号。</p><div class="dialog-actions"><button type="button" class="secondary-button" data-action="task" data-id="${esc(id)}">取消</button><button type="button" class="primary-button" data-action="delete" data-id="${esc(id)}">确认删除</button></div>`); break;
      }
      case 'delete': state.tasks=state.tasks.filter(t=>t.id!==id); changed({keepScroll:true}); closeModal(); toast('任务已删除'); break;
      case 'preview-task': toast('这是复用同一个 TaskItem 的状态样例；在「日程」或「任务」中编辑真实示例。'); break;
      case 'reset-confirm': openModal('恢复示例数据？', `<p class="dialog-description">这会清除在当前原型里新增和修改的任务，恢复 11 月 3 日的演示状态。真实任务软件不受影响。</p><div class="dialog-actions"><button type="button" class="secondary-button" data-action="close">取消</button><button type="button" class="primary-button" data-action="reset">恢复示例</button></div>`); break;
      case 'reset': state=initialData(); pendingScroll=openingScroll(); changed(); closeModal(); toast('已恢复示例数据'); break;
    }
  }
  document.addEventListener('click', event => {
    const button=event.target.closest('button[data-action]');
    if (button && !button.disabled) handleAction(button);
  });
  modal.addEventListener('change', event => {
    const key=event.target.dataset.setting;
    if (!['showCompleted','showBands'].includes(key)) return;
    state[key]=event.target.checked;
    changed({keepScroll:true});
  });
  modal.addEventListener('submit', event => {
    event.preventDefault();
    const form=event.target;
    const formData=new FormData(form);
    if (form.id==='date-form') {
      const date=String(formData.get('date')||'');
      if (!validDate(date)) return;
      setDate(date); closeModal(); return;
    }
    if (form.id!=='task-form') return;
    const toMinutes = value => {
      const match=/^(\d{2}):(\d{2})$/.exec(String(value));
      if (!match || Number(match[1])>23 || Number(match[2])>59) return NaN;
      return Number(match[1])*60+Number(match[2]);
    };
    const title=String(formData.get('title')||'').trim();
    const date=String(formData.get('date')||'');
    const start=toMinutes(formData.get('start')), end=toMinutes(formData.get('end'));
    const error=form.querySelector('#form-error');
    const fail=message=>{error.hidden=false;error.textContent=message;};
    if (!title) return fail('请填写任务名称，不能只输入空格。');
    if (!validDate(date)) return fail('请选择有效日期。');
    if (!Number.isFinite(start)||!Number.isFinite(end)||end<=start) return fail('结束时间必须晚于开始时间。本原型暂不支持跨午夜任务。');
    const id=form.dataset.id;
    const old=id?state.tasks.find(task=>task.id===id):null;
    const uuid=()=>globalThis.crypto?.randomUUID?.() || `t-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const task={id:old?.id||uuid(),title,date,start,end,done:formData.get('done')==='on',note:String(formData.get('note')||'').trim()};
    if (old) Object.assign(old,task); else state.tasks.push(task);
    if (form.dataset.backlog) state.backlog=state.backlog.filter(item=>item.id!==form.dataset.backlog);
    const sameDay=state.date===date;
    state.date=date;
    changed({keepScroll:sameDay});
    closeModal();
    if (state.page==='schedule' && state.view==='day') scrollToMinute(start-20);
    toast(storageOK ? (old ? '修改已保存' : '任务已加入日程') : '修改已生效（临时模式，刷新后不保留）');
  });
  document.addEventListener('keydown', event => {
    if (event.key==='Escape' && !modal.open) toastNode.classList.remove('visible');
  });
  // Refresh the real-time marker only on the device's actual current date.
  // Never add a pretend "now" line to the historical demo date.
  setInterval(() => {
    if (state.page==='schedule' && state.view==='day' && state.date===dateKey(new Date()) && !modal.open) render({keepScroll:true});
  }, 60000);
  render();
  if (!storageOK) toast('本地保存不可用，当前以临时演示模式运行。');
})();

</script>
</body>
</html>
