# One always-on Dovun instance; every device (desktop app, phone
# browser) connects to it and shares the same data.
#
# Copy this file to compose.override.yml (or export the variables) and fill in
# your own values. See docs/deployment.md for the full walkthrough.

services:
  wwa:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: work-with-agent:latest
    container_name: work-with-agent
    restart: unless-stopped
    environment:
      # A long random secret. Generate with: openssl rand -base64 32
      DOVUN_OWNER_KEY: ${DOVUN_OWNER_KEY:?Set DOVUN_OWNER_KEY}
      # The address browsers use to reach this server; cookies and CORS follow it.
      DOVUN_PUBLIC_URL: ${DOVUN_PUBLIC_URL:?Set DOVUN_PUBLIC_URL}
      DOVUN_PUBLIC_HTTPS: 1
      CLIENT_ORIGIN: ${DOVUN_PUBLIC_URL:?Set DOVUN_PUBLIC_URL}
      TZ: ${TZ:-Asia/Shanghai}
      BRAVE_IMAGE_SEARCH_KEY: ${BRAVE_IMAGE_SEARCH_KEY:-}
      BRAVE_IMAGE_SEARCH_PROXY_URL: ${BRAVE_IMAGE_SEARCH_PROXY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Only nginx (or your reverse proxy) on this host talks to the container.
      - "127.0.0.1:12716:3016"
    volumes:
      - ./data:/data
